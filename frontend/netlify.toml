# ===================================================================
# SmartAttend Frontend — Netlify Configuration (Frontend Directory)
# ===================================================================

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "/api"

[[redirects]]
  from = "/api/*"
  to = "https://smartattend-backend-64np.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
