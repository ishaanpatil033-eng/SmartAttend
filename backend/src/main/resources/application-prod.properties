# ===================================================================
# SmartAttend: Students Attendance Management System
# Production Application Configuration (application-prod.properties)
# Activated via --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ===================================================================

server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.application.name=smartattend-backend

# -------------------------------------------------------------------
# Reverse Proxy & Secure Header Forwarding
# Ensures X-Forwarded-Proto, X-Forwarded-For, and HTTPS context are recognized
# -------------------------------------------------------------------
server.forward-headers-strategy=framework

# -------------------------------------------------------------------
# Session & Cookie Security
# -------------------------------------------------------------------
server.servlet.session.timeout=3600s
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# -------------------------------------------------------------------
# Production MySQL Database Configuration
# In production, credentials MUST be provided via environment variables.
# Startup will safely fail if required database credentials are missing.
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Production Connection Pooling (HikariCP)
# -------------------------------------------------------------------
spring.datasource.hikari.pool-name=SmartAttendHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# -------------------------------------------------------------------
# Production Hibernate / JPA Configuration
# Schema updates must be managed via migrations; SQL logging disabled
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# -------------------------------------------------------------------
# Security & CORS Origin Configuration
# Production allowed origins must be explicit via environment variable.
# -------------------------------------------------------------------
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# -------------------------------------------------------------------
# Attendance QR Security
# -------------------------------------------------------------------
app.qr.expiration-seconds=5

# -------------------------------------------------------------------
# Campus Geofence Coordinates
# -------------------------------------------------------------------
attendance.location.latitude=${ATTENDANCE_LATITUDE:19.0760}
attendance.location.longitude=${ATTENDANCE_LONGITUDE:72.8777}
attendance.location.radius-meters=${ATTENDANCE_RADIUS_METERS:100.0}
attendance.location.max-accuracy-meters=${ATTENDANCE_MAX_ACCURACY:50.0}

# -------------------------------------------------------------------
# Moodle LMS Integration
# -------------------------------------------------------------------
moodle.base-url=${MOODLE_BASE_URL:http://host.docker.internal/moodle}
moodle.token=${MOODLE_TOKEN:}
moodle.course-id=${MOODLE_COURSE_ID:1}
moodle.simulate-assignments-on-unconfigured=false
