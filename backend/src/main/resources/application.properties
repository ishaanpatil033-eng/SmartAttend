server.port=8080

# Application Name
spring.application.name=smartattend-backend

# -------------------------------------------------------------------
# MySQL Database Configuration (Placeholders for local database setup)
# Replace the placeholder values with your actual MySQL credentials
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/smartattend?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Piyush@s@p123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

