# ===================================================================
# SmartAttend: Students Attendance Management System
# Backend Application Configuration
# ===================================================================

# Server Port
server.port=${PORT:8080}

# Application Name
spring.application.name=smartattend-backend

# -------------------------------------------------------------------
# MySQL Database Configuration (Placeholders for local database setup)
# Replace the placeholder values with your actual MySQL credentials
# or override via environment variables / application-local.properties
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartattend?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# Security & Frontend Integration
# -------------------------------------------------------------------
app.frontend.origin=http://localhost:5173

# -------------------------------------------------------------------
# JWT Configuration Placeholders
# -------------------------------------------------------------------
app.jwt.secret=replace_with_a_secure_random_256_bit_jwt_secret_key_here
app.jwt.expiration-seconds=3600
app.qr.expiration-seconds=5

# -------------------------------------------------------------------
# Moodle Integration Configuration
# -------------------------------------------------------------------
moodle.base-url=${MOODLE_BASE_URL:http://localhost/moodle}
moodle.token=${MOODLE_TOKEN:}
moodle.course-id=1

# Support optional local configuration without committing secrets
spring.config.import=optional:file:./application-local.properties,optional:file:./config/application-local.properties,optional:classpath:application-local.properties

